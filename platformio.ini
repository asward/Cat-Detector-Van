; LoRaWAN coverage surveyor for Heltec WiFi LoRa 32 V2 (ESP32 + SX1276 + SSD1306)
; Build & flash:  pio run -t upload      Serial log:  pio device monitor

[env:heltec_v2]
platform = espressif32
board = heltec_wifi_lora_32_V2
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/jgromes/RadioLib.git#8.0.0
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1
