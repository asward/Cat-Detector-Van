; Cat Detector Van — two firmwares for Heltec WiFi LoRa 32 V2 (ESP32 + SX1276 + SSD1306)
;   pio run -e node -t upload    -> battery switch node
;   pio run -e base -t upload    -> base station with display
;   pio device monitor           -> serial log (115200)

[env]
platform = espressif32
board = heltec_wifi_lora_32_V2
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/jgromes/RadioLib.git#8.0.0
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1

[env:node]
build_src_filter = +<node/>

[env:base]
build_src_filter = +<base/>
